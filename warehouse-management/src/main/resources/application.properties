# ===== 服务器 =====
server.port=8081
server.servlet.context-path=/api

# ===== 数据库 =====
# 密码等敏感信息用环境变量覆盖，避免明文进仓库：
#   set DB_PASSWORD=你的密码      (Windows cmd)
#   $env:DB_PASSWORD="你的密码"   (PowerShell)
spring.datasource.url=jdbc:mysql://localhost:3306/warehouse_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
# 开发阶段用 update 自动建表；正式环境应改成 none 并用 sql/warehouse_db.sql 初始化
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# 生产环境务必通过环境变量覆盖；HS256 要求密钥至少 32 字节
jwt.secret=${JWT_SECRET:warehouse-management-jwt-secret-key-please-change-in-production-2024}
jwt.expire-hours=12

# ===== 日志 =====
logging.level.com.warehouse.warehouse_management=info
