# 集成测试使用 H2 内存库，不依赖本机 MySQL
spring.datasource.url=jdbc:h2:mem:warehouse_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=unit-test-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
jwt.expire-hours=1

logging.level.com.warehouse.warehouse_management=warn
